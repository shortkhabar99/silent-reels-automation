
name: Automatic News Update

on:
  schedule:
    - cron: '15 1,3,5,7,9,11,12,13,14,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Collect news
        run: python main.py

      - name: Save news
        run: |
          git config user.name "News Bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Automatic news update"
          git push
